version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Building application..."
      - npm run build
      - echo "Verifying build artifacts..."
      - ls -la dist/
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - dist/**/*
  name: BuildArtifact
  
secondary-artifacts:
  PackageFiles:
    files:
      - package.json
      - package-lock.json
    name: PackageArtifact

cache:
  paths:
    - node_modules/**/*